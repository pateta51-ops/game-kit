        <label class="orientation">Orientation <select data-k="orientation"><option>Portrait</option><option>Landscape</option></select></label>

        <label>Bridge <output></output><input data-k="d2" type="range" min=".2" max="2" step=".05" value=".75"></label>
        <label>Square up <output></output><input data-k="d3" type="range" min=".1" max="1.5" step=".05" value=".45"></label>
      </div>
      <button class="kit" type="button">Kit default timings</button>
      <p class="note"></p>
      <code></code>
    </div>
  </section>
  <section aria-labelledby="side-title">

        <label class="orientation">Orientation <select data-k="orientation"><option>Portrait</option><option>Landscape</option></select></label>
      </div>
      <div class="timings">
        <label>Tilt in / split <output></output><input data-k="d0" type="range" min=".1" max="1.5" step=".05" value=".45"></label>
        <label>Riffle <output></output><input data-k="d1" type="range" min=".4" max="2.5" step=".05" value="1.35"></label>
        <label>Bridge <output></output><input data-k="d2" type="range" min=".2" max="2" step=".05" value=".75"></label>
        <label>Tilt out / square <output></output><input data-k="d3" type="range" min=".1" max="1.5" step=".05" value=".45"></label>
      </div>
      <button class="kit" type="button">Kit default timings</button>
      <p class="note"></p>
      <code></code>
    </div>
  </section>
</div>
</main>

    panel.querySelector('.note').textContent = speed === 0 ? 'Still at 0×. Phase times are set at 1×.' :
      `Phase times are set at 1×. A full play takes ${(durations.reduce((a, b) => a + b, 0) / speed).toFixed(2)} s. The kit default is ${DM.RIFFLE_MS / 1000} s at 1×.`;
    const [time, o] = kitOptions(view);
    panel.querySelector('code').textContent = `riffle(deck, ${+time.toFixed(3)}, ${JSON.stringify(o).replace(/"(\w+)":/g, '$1: ').replace(/,/g, ', ').replace(/"/g, "'")})`;
    (view === 'top' ? topDeck : sideDeck).toggleAttribute('data-landscape', orientation === 'landscape');
  }
  const rect = topDeck.getBoundingClientRect();
  const dpr = devicePixelRatio;
  const face = document.createElement('canvas');
  const [w, h] = [Math.round(rect.width * dpr) / dpr, Math.round(rect.height * dpr) / dpr];
  face.width = Math.round((w + 4) * dpr);
  face.height = Math.round((h + 4) * dpr);
  const cards = Math.max(2, Math.round(get('top', 'cards').valueAsNumber));
  const pitch = Math.min(w, h) * 0.092 / (cards - 1) * dpr;
  const facePaint = face.getContext('2d');
  facePaint.scale(dpr, dpr);
  facePaint.translate(2, 2);
  DM.drawNeutralBack(facePaint, w, h);
  const back = topDeck.firstElementChild;
  back.width = Math.round(Math.ceil(w) * dpr);
  back.height = Math.round(Math.ceil(h + (cards - 1) * pitch / dpr) * dpr);
  Object.assign(back.style, { left: Math.round(rect.left) - rect.left + 'px', top: Math.round(rect.top) - rect.top + 'px', width: Math.ceil(w) + 'px', height: back.height / dpr + 'px' });
  const paint = back.getContext('2d');
  for (let index = 0; index < cards; index++) paint.drawImage(face, -2 * dpr, (cards - 1 - index) * pitch - 2 * dpr);
}

function play(view) {
  DM.finishDeckMotions();
  const [time, o] = kitOptions(view);
  void DM.riffle(view === 'top' ? topDeck : sideDeck, time, view === 'top' ? o : { ...o, back: previewBack });
}

byId('top-play').addEventListener('click', () => play('top'));
byId('play').addEventListener('click', () => play('side'));
for (const view of ['top', 'side']) {
  panels[view].addEventListener('input', () => {
    DM.finishDeckMotions();
    update();
    play(view);
  });
  panels[view].querySelector('.kit').addEventListener('click', () => {
    DM.RIFFLE_PHASES_MS.forEach((ms, i) => { get(view, 'd' + i).value = ms / 1000; });
    panels[view].dispatchEvent(new Event('input'));
  });
}
update();
addEventListener('resize', update);
</script>
</body>
</html>
