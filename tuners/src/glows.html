<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glows &amp; Marks Tuner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a felt table on top holding the live hand, the controls below in a wrapping grid; one dark look by choice. */
:root {
  --felt: #17302a; --felt-edge: #0e1f1b; --panel: #1b2124; --line: #2c3539; --fg: #e8ece9; --muted: #9aa8a3; --accent: #e9c46a;
  --display: 'Space Grotesk', system-ui, sans-serif; --body: 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
body { background: var(--panel); color: var(--fg); font: 14px/1.5 var(--body); }
.wrap { max-width: 1180px; grid-template-columns: minmax(0, 1fr); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; display: grid; gap: 18px; }
h1 { font: 700 22px/1.2 var(--display); margin: 0; letter-spacing: .01em; }
.sub { color: var(--muted); margin: 2px 0 0; max-width: 70ch; }
.table { background: radial-gradient(120% 90% at 50% 100%, #1f4038, var(--felt) 60%, var(--felt-edge)); border-radius: 14px; border: 1px solid var(--line); padding: 68px 18px 36px; overflow: hidden; position: relative; }
.table .note { position: absolute; top: 12px; left: 14px; right: 14px; color: var(--muted); font-size: 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.presets span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
.presets button { font: 600 13px var(--body); color: var(--fg); background: #232b2e; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.presets button[aria-pressed="true"] { background: var(--accent); color: #1b1608; border-color: var(--accent); }
.presets button:focus-visible, .ctl input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctls { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 10px 22px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 12px; margin: 0; min-width: 0; display: grid; gap: 8px; }
legend { font: 700 12px var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); padding: 0 6px; }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.ctl label { font-size: 13px; }
.ctl output { font: 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.ctl input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.ctl small { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.code { background: #12171a; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 12.5px/1.6 var(--mono); color: #cfe3da; overflow-x: auto; white-space: pre; }
.codebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.codebar h2 { font: 700 15px var(--display); margin: 0; }
.codebar button { font: 600 12px var(--body); color: var(--fg); background: #232b2e; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

.presets select, .table button { font: 600 13px var(--body); color: var(--fg); background: #232b2e; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
button, select { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.table .note { position: static; margin: -56px 0 24px; min-height: 2.8em; }
.preview { display: flex; justify-content: center; align-items: center; gap: clamp(12px, 4vw, 40px); min-height: 156px; }
.preview[hidden], [hidden] { display: none !important; }
.preview .cf { width: min(26%, 108px); aspect-ratio: 5 / 7; border-radius: 8px; box-sizing: border-box; border: 2px solid rgb(255 255 255 / .55); display: flex; flex-direction: column; justify-content: space-between; padding: 8px; font: 700 14px var(--display); color: #fff; text-align: left; background: linear-gradient(160deg, hsl(var(--hue) 45% 43%), hsl(var(--hue) 40% 23%)); }
:where(.preview .cf) { box-shadow: 0 4px 10px rgb(0 0 0 / .45); }
.cf small { font: 12px var(--body); }
.preview .icon-face { width: min(100%, 210px); aspect-ratio: 5 / 3; padding: 12px; }
.icon-face p { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin: 0; }
.counter-row { font-size: 32px; }
.counter-row svg { display: block; width: 100%; height: 100%; }
[data-part='counter'][data-level='low'] { outline: 2px solid #e9c46a; }
[data-part='counter'][data-level='out'] { outline: 2px solid #ff8f8f; }
[data-part='tag'] { color: #b4eda1; font: 700 20px var(--display); }
[data-part='tag'][data-sign='-'] { color: #ffacac; }
.counter-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
#warning { text-align: center; color: var(--accent); min-height: 1.5em; margin: 8px 0 0; }
fieldset, .ctl { align-content: start; }
.ctl input[type='color'] { width: 50px; padding: 0; }
.ctl input[type='checkbox'] { width: auto; justify-self: start; }
</style>
<style id="active-look"></style>
<script type="text/plain" id="base">/*@kit-css components/picked-state/picked.css*/</script>
<script type="text/plain" id="classic">/*@kit-css components/picked-state/looks/kit-classic.css*/</script>
<script type="text/plain" id="raised">/*@kit-css components/picked-state/looks/imperium.css*/</script>
<script type="text/plain" id="ring">/*@kit-css components/picked-state/looks/stcc.css*/</script>
<script type="text/plain" id="legal">/*@kit-css components/prompt-host/looks/legal-glow.css*/</script>
<script type="text/plain" id="bloom">/*@kit-css components/prompt-host/looks/imperium-legal.css*/</script>
<script type="text/plain" id="icons">/*@kit-css components/card-parts/looks/icon-glow.css*/</script>
<script type="text/plain" id="counter-source">/*@kit-css components/counter/ui.tsx*/</script>
<script type="text/plain" id="health">/*@kit-css components/counter/looks/health-glow.css*/</script>

<div class="wrap">
  <header>
    <h1>Glows &amp; Marks Tuner</h1>
    <p class="sub">Tune the kit’s marks on sample cards and a resource counter. The previews use the kit CSS, the kit’s icon parser and its React Counter.</p>
  </header>

  <section class="table" id="stage" aria-label="Live preview">
    <p class="note" id="note"></p>
    <div class="preview" id="picked-preview">
      <button class="cf" style="--hue: 165" type="button">Grove<small>Card A</small></button>
      <button class="cf" style="--hue: 218" type="button">Harbor<small>Card B</small></button>
      <button class="cf" style="--hue: 320" type="button">Summit<small>Card C</small></button>
    </div>
    <div class="preview" id="legal-preview" hidden>
      <div class="cf" style="--hue: 165" data-mark="legal">Grove<small>Legal</small></div>
      <div class="cf" style="--hue: 218" data-mark="legal">Harbor<small>Legal</small></div>
      <div class="cf" style="--hue: 320" data-mark="barred">Summit<small>Barred</small></div>
    </div>
    <div class="preview" id="icons-preview" hidden>
      <div class="cf icon-face" style="--hue: 218"><strong>Supply Cache</strong><p id="icon-text"></p></div>
    </div>
    <div id="health-preview" hidden>
      <div class="preview">
        <div class="counter-row" id="counter"></div>
      </div>
      <div class="counter-actions">
        <button type="button" id="add">Add 3</button>
        <button type="button" id="remove">Remove 3</button>
        <button type="button" id="play">Play</button>
      </div>
      <p id="warning" role="status"></p>
    </div>
  </section>

  <div class="presets">
    <label for="look">Look</label>
    <select id="look">
      <optgroup label="Picked cards">
        <option value="base">Base mark</option>
        <option value="classic" selected>Green frame and tick</option>
        <option value="raised">Raised gold glow</option>
        <option value="ring">White ring</option>
      </optgroup>
      <optgroup label="Legal cards">
        <option value="legal">Blue edge</option>
        <option value="bloom">Gold bloom</option>
      </optgroup>
      <optgroup label="Widgets">
        <option value="icons">Inline icon glow</option>
        <option value="health">Resource counter</option>
      </optgroup>
    </select>
    <button type="button" id="reset">Kit default</button>
  </div>
  <div class="ctls" id="ctls"></div>

  <div>
    <div class="codebar"><h2>These settings in code</h2><button type="button" id="copy">Copy</button></div>
    <pre class="code" id="code" tabindex="0"></pre>
  </div>
</div>

<script>
//@kit-js components/picked-state/index.ts as PICKED
//@kit-js components/card-parts/text.ts as ICONS
//@kit-js tuners/src/counter-preview.mjs as COUNTER
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const cards = [...$('picked-preview').children];
const preview = COUNTER.mountCounterPreview($('counter'));
const phone = matchMedia('(max-width: 700px)');
const look = $('look');
const PATHS = {
  base: 'picked-state/picked.css',
  classic: 'picked-state/looks/kit-classic.css',
  raised: 'picked-state/looks/imperium.css',
  ring: 'picked-state/looks/stcc.css',
  legal: 'prompt-host/looks/legal-glow.css',
  bloom: 'prompt-host/looks/imperium-legal.css',
  icons: 'card-parts/looks/icon-glow.css',
  health: 'counter/looks/health-glow.css',
};
const CTLS = {
  classic: [
    ['Frame', [
      ['--picked', 'Frame and badge', 'color', 'Main selection colour.'],
      ['--picked-edge', 'Outer edge', 'color', 'Rim around the card and badge.'],
      ['--picked-width', 'Frame width', 'px', 'Thickness of the selection frame.', 0, 16, 1],
    ]],
    ['Tick and dimming', [
      ['--tick', 'Badge size', 'px', 'Diameter of the circular tick badge.', 1, 50, 1],
      ['--tick-mark', 'Tick colour', 'svg', 'Stroke inside the badge.'],
      ['--unpicked-dim', 'Unpicked opacity', '', 'A lower value makes the other cards dimmer.', 0, 1, .01],
    ]],
  ],
  legal: [
    ['Legal glow', [
      ['--focus', 'Edge colour', 'color', 'Solid outline around a legal card.'],
      ['--glow', 'Halo colour', 'color', 'Soft shadow beyond the edge.'],
    ]],
  ],
  bloom: [
    ['Legal glow', [
      ['--pick-edge-size', 'Edge size', 'px', 'Scales the blur and spread of all three layers.', 0, 16, .5],
      ['--pick-glow-core', 'Core', 'color', 'Colour of the narrow inner shadow.'],
      ['--pick-glow', 'Glow', 'color', 'Colour of the middle shadow.'],
      ['--pick-glow-far', 'Outer bloom', 'color', 'Colour of the broadest shadow.'],
    ]],
  ],
  icons: [
    ['Inline icons', [
      ['--icon-glow', 'Fallback colour', 'color', 'Colour used by icons without their own override.'],
      ['--kw', 'Star colour', 'color', 'Overrides the fallback on the star alone.'],
    ]],
  ],
  health: [
    ['Counter look', [
      ['--counter-icon', 'Icon colour', 'color', 'Changes the icon fill. The shadow colour is fixed.'],
    ]],
    ['Motion', [
      ['speed', 'Time multiplier', '×', 'Scales count, bump and tag time. Zero is instant.', 0, 3, .05],
      ['count', 'Animate number', 'check', 'Count to the new value or jump straight there.'],
      ['bumpOnChange', 'Bump on change', 'check', 'Scale the pill briefly after each change.'],
    ]],
    ['Warning preview', [
      ['low', 'Low at or below', ' units', 'Show a warning at this count or below. The kit has no default.', 0, 20, 1],
      ['out', 'Out at or below', ' units', 'Use the out warning first when both limits apply.', 0, 20, 1],
    ]],
  ],
};
const NOTES = {
  base: 'Pick a card to change its selection state. The base stylesheet ships without a visual mark.',
  classic: 'Pick a card to see the frame and tick. The other cards dim by the opacity shown below.',
  raised: 'Pick a card to see the lift and gold glow. This look has fixed CSS values.',
  ring: 'Pick a card to see the white ring and glow. This look has fixed CSS values.',
  legal: 'The solid edge and soft halo apply to both legal cards.',
  bloom: 'The edge size scales all three layers. Hover a legal card to see its lift.',
  icons: 'The star uses its own colour. Reset to see all icons inherit the fallback.',
};
const icons = {
  leaf: { label: 'leaf', body: '<path fill="currentColor" d="M20 3C7 3 3 8 4 18l5-5 1 1-5 6C17 21 22 12 20 3Z"/>' },
  star: { label: 'star', body: '<path fill="currentColor" d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/>' },
  drop: { label: 'drop', body: '<path fill="currentColor" d="M12 2c-2 4-8 9-8 13a8 8 0 0 0 16 0c0-4-6-9-8-13Z"/>' },
};
$('icon-text').innerHTML = ICONS.parseIconText('Gain [[leaf]] [[star]] or [[drop]].', icons).map((part) => part.t === 'text'
  ? part.s
  : `<svg viewBox="0 0 24 24" data-icon="${part.name}" role="img" aria-label="${part.label}">${icons[part.name].body}</svg>`).join('');
const star = $('icons-preview').querySelector('[data-icon="star"]');
let selected = 1;
let settings = {};
let initial = {};
let value = 8;
let previous = 5;
const sampleLow = 3;
// The Counter's default pace is private to the component.
const motionDefault = Number($('counter-source').textContent.match(/withReducedMotion\(speed \? speed\(\) : ([\d.]+)\)/)[1]);
let defaultOut = -1;
while (COUNTER.levelOf(defaultOut + 1, { low: sampleLow }) === 'out') defaultOut++;
function pick(index) {
  selected = index;
  cards.forEach((card, i) => {
    const attrs = PICKED.pickedAttrs(i === selected, true);
    card.dataset.picked = attrs['data-picked'];
    card.setAttribute('aria-pressed', i === selected);
  });
}
cards.forEach((card, i) => card.addEventListener('click', () => pick(i)));

function fallback(css, token) {
  const match = css.match(new RegExp(`${token}:([^;}]+)`));
  return match?.[1] ?? css.match(new RegExp(`var\\(${token},\\s*(rgb\\([^)]*\\)|#[\\da-f]+|[\\d.]+px)`, 'i'))?.[1];
}
function colorParts(raw) {
  if (raw.startsWith('#')) return [raw, 1];
  const [r, g, b, alpha = 1] = raw.match(/[\d.]+/g).map(Number);
  return ['#' + [r, g, b].map((n) => n.toString(16).padStart(2, '0')).join(''), alpha];
}
function defaults(css) {
  const result = { speed: motionDefault, count: true, bumpOnChange: true, low: sampleLow, out: defaultOut };
  for (const [, controls] of CTLS[look.value] ?? []) {
    for (const [key, , unit] of controls) {
      if (!key.startsWith('--')) continue;
      const raw = fallback(css, key === '--kw' ? '--icon-glow' : key);
      if (unit === 'svg') {
        result[key] = decodeURIComponent(raw).match(/stroke='(#[\da-f]+)'/i)[1];
      } else if (unit === 'color') {
        [result[key], result[key + '-alpha']] = colorParts(raw);
      } else {
        const compact = phone.matches && css.match(/:root\[data-layout='phone'\]\{([^}]+)/);
        result[key] = parseFloat((compact && fallback(compact[1], key)) || raw);
      }
    }
  }
  result['--kw-override'] = false;
  return result;
}
function control(group, key, label, unit, help, min, max, step) {
  const field = document.createElement('div');
  field.className = 'ctl';
  const color = unit === 'color' || unit === 'svg';
  const suffix = color || unit === 'check' ? '' : unit;
  const type = color ? 'color' : unit === 'check' ? 'checkbox' : 'range';
  field.innerHTML = `<label for="${key}">${label}</label><output for="${key}"></output>
    <input type="${type}" id="${key}" aria-describedby="${key}-help">
    <small id="${key}-help">${help}</small>`;
  const input = field.querySelector('input');
  const output = field.querySelector('output');
  if (type === 'range') Object.assign(input, { min, max, step });
  input.value = settings[key];
  input.checked = settings[key] === true;
  const readout = () => {
    output.value = type === 'checkbox' ? (input.checked ? 'On' : 'Off') : input.value + suffix;
  };
  readout();
  input.addEventListener('input', () => {
    settings[key] = type === 'checkbox' ? input.checked : color ? input.value : Number(input.value);
    if (key === '--kw' || key === '--kw-alpha') {
      settings['--kw-override'] = true;
      $('--kw-override').checked = true;
      $('--kw-override').dispatchEvent(new Event('input'));
      readout();
      return;
    }
    readout();
    render();
    if (look.value === 'health') replay();
  });
  group.append(field);
}
function controls() {
  $('ctls').replaceChildren();
  for (const [title, entries] of CTLS[look.value] ?? []) {
    const group = document.createElement('fieldset');
    group.innerHTML = `<legend>${title}</legend>`;
    for (const entry of entries) {
      const [key, label] = entry;
      if (key === '--kw') control(group, '--kw-override', 'Override star colour', 'check', 'Turn off to inherit the fallback.');
      control(group, ...entry);
      if (initial[key + '-alpha'] < 1) {
        control(group, key + '-alpha', label + ' opacity', '', 'Lower this to make the shadow more transparent.', 0, 1, .01);
      }
    }
    $('ctls').append(group);
  }
}
function render() {
  const id = look.value;
  const lines = [];
  stage.removeAttribute('style');
  star.removeAttribute('style');
  for (const [, controls] of CTLS[id] ?? []) {
    for (const [key, , unit] of controls) {
      if (!key.startsWith('--') || (key === '--kw' && !settings['--kw-override'])) continue;
      let css = settings[key];
      if (unit === 'svg') {
        const original = fallback($(id).textContent, key);
        css = original.replace(encodeURIComponent(initial[key]), encodeURIComponent(css));
      } else if (unit === 'color') {
        const alpha = settings[key + '-alpha'];
        if (alpha < 1) {
          const rgb = css.slice(1).match(/../g).map((channel) => parseInt(channel, 16));
          css = `rgb(${rgb.join(' ')} / ${alpha})`;
        }
      } else {
        css += unit;
      }
      const target = key === '--kw' ? star : stage;
      target.style.setProperty(key, css);
      lines.push(`  ${key}: ${css};${target === star ? ' /* on the star icon only */' : ''}`);
    }
  }
  let markup;
  if (id === 'health') {
    const { low, out, speed, count, bumpOnChange } = settings;
    markup = `<Counter value={${value}} anchor="supply" icon={<SupplyIcon />}
  speed={() => ${speed}} count={${count}} bumpOnChange={${bumpOnChange}}
  thresholds={{ low: ${low}, out: ${out} }} />`;
    $('note').textContent = speed === 0 ? 'The number jumps to its new value at zero speed.'
      : `The bump lasts ${COUNTER.scaledMs(COUNTER.BUMP_MS, speed)} ms when enabled. The change tag lasts ${COUNTER.scaledMs(COUNTER.TAG_MS, speed)} ms. Play repeats the last change.`;
  } else {
    $('note').textContent = NOTES[id];
    if (id === 'icons') markup = '<IconText text="Gain [[leaf]] [[star]] or [[drop]]." icons={icons} />';
    else if (id === 'legal' || id === 'bloom') markup = '<button data-mark={enabled ? "legal" : "barred"}>…</button>';
    else markup = '<button {...pickedAttrs(isPicked, anyPicked)}>…</button>';
  }
  $('code').textContent = [`// Look: kit/${PATHS[id]}`, markup, lines.join('\n')].filter(Boolean).join('\n\n');
}

function showCounter(next, instant = false) {
  const { low, out, speed, count, bumpOnChange } = settings;
  $('warning').textContent = '';
  preview({
    value: next,
    thresholds: { low, out },
    speed: instant ? () => 0 : speed === motionDefault ? undefined : () => speed,
    count: instant ? false : count,
    bumpOnChange,
    onCross: instant ? undefined : (level) => {
      $('warning').textContent = level === 'out' ? 'Supply ran out' : 'Supply is running low';
    },
  });
  $('remove').disabled = next === 0;
}

function replay() {
  showCounter(previous, true);
  showCounter(value);
}

function change(delta) {
  const next = Math.max(0, value + delta);
  if (next === value) return;
  previous = value;
  value = next;
  render();
  showCounter(value);
}
$('add').addEventListener('click', () => change(3));
$('remove').addEventListener('click', () => change(-3));
$('play').addEventListener('click', replay);

function reset() {
  const id = look.value;
  document.documentElement.toggleAttribute('data-layout', phone.matches);
  if (phone.matches) document.documentElement.dataset.layout = 'phone';
  const css = $(id).textContent;
  $('active-look').textContent = ['classic', 'raised', 'ring'].includes(id)
    ? $('base').textContent + css
    : css;
  const panel = id === 'health' || id === 'icons' ? id : id === 'legal' || id === 'bloom' ? 'legal' : 'picked';
  for (const key of ['picked', 'legal', 'icons', 'health']) $(key + '-preview').hidden = key !== panel;
  initial = defaults(css);
  settings = { ...initial };
  controls();
  render();
  if (id === 'health') showCounter(value, true);
}
look.addEventListener('change', reset);
$('reset').addEventListener('click', () => {
  reset();
  if (look.value === 'health') replay();
});
phone.addEventListener('change', reset);
$('copy').addEventListener('click', async () => {
  const button = $('copy');
  try {
    await navigator.clipboard.writeText($('code').textContent);
    button.textContent = 'Copied';
  } catch {
    const selection = getSelection();
    const range = document.createRange();
    range.selectNodeContents($('code'));
    selection.removeAllRanges();
    selection.addRange(range);
    button.textContent = 'Selected';
  }
  setTimeout(() => { button.textContent = 'Copy'; }, 1200);
});
pick(selected);
reset();
</script>
</html>
