<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Target Arrow Tuner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root {
  --felt: #17302a; --felt-edge: #0e1f1b; --panel: #1b2124; --line: #2c3539; --fg: #e8ece9; --muted: #9aa8a3; --accent: #e9c46a;
  --display: 'Space Grotesk', system-ui, sans-serif; --body: 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
body { background: var(--panel); color: var(--fg); font: 14px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; display: grid; gap: 18px; }
h1 { font: 700 22px/1.2 var(--display); margin: 0; letter-spacing: .01em; }
.sub { color: var(--muted); margin: 2px 0 0; max-width: 70ch; }
.table { background: radial-gradient(120% 90% at 50% 100%, #1f4038, var(--felt) 60%, var(--felt-edge)); border-radius: 14px; border: 1px solid var(--line); padding: 210px 12px 60px; overflow: hidden; position: relative; }
.table .note { position: absolute; top: 12px; left: 14px; right: 14px; color: var(--muted); font-size: 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.presets span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
.presets button { font: 600 13px var(--body); color: var(--fg); background: #232b2e; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.presets button[aria-pressed="true"] { background: var(--accent); color: #1b1608; border-color: var(--accent); }
.presets button:focus-visible, .ctl input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctls { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 22px; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 12px; margin: 0; min-width: 0; display: grid; gap: 8px; }
legend { font: 700 12px var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); padding: 0 6px; }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.ctl label { font-size: 13px; }
.ctl output { font: 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.ctl input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.ctl small { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.code { background: #12171a; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font: 12.5px/1.6 var(--mono); color: #cfe3da; overflow-x: auto; white-space: pre; }
.codebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.codebar h2 { font: 700 15px var(--display); margin: 0; }
.codebar button { font: 600 12px var(--body); color: var(--fg); background: #232b2e; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }

.wrap { grid-template-columns: minmax(0, 1fr); }
.ctls { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.table { position: sticky; top: 8px; z-index: 1; padding: 14px; display: grid; gap: 12px; }
fieldset { align-content: start; }
.table .note { position: static; margin: 0; }
.stage { display: grid; grid-template-columns: 1fr 2fr; align-items: center; gap: 16px; min-height: 154px; padding: 8px 0; }
.targets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); justify-items: center; gap: 8px; }
.prompt { grid-column: 1 / -1; }
.card, .prompt { color: var(--fg); border: 1px solid rgb(255 255 255 / .55); box-shadow: 0 4px 10px rgb(0 0 0 / .45); font: 700 14px var(--display); }
.card { width: min(100%, 96px); min-width: 0; aspect-ratio: 2 / 3; border-radius: 8px; padding: 4px; background: linear-gradient(160deg, #6c4240, #3e2427); }
.source { display: grid; place-items: center; margin-inline: auto; background: linear-gradient(160deg, #405f87, #242f4c); box-sizing: border-box; }
.prompt { background: #232b2e; border-radius: 6px; padding: 6px 12px; }
.card:is(button), .prompt { cursor: pointer; }
[data-part="target-arrow"][data-state="hidden"] { visibility: hidden; }
.ctl input[type="color"] { height: 24px; border: 0; padding: 0; background: transparent; }
@media (max-width: 600px) {
  .stage { grid-template-columns: 1fr 3fr; gap: 8px; min-height: 0; }
  .card { font-size: 12px; }
}
</style>
<style id="kit-css">/*@kit-css components/target-arrow/target-arrow.css*/</style>

<div class="wrap">
  <header>
    <h1>Target Arrow Tuner</h1>
    <p class="sub">Move the pointer to aim and click a target, or press Play to replay. On touch screens, tap a target to preview the hit.</p>
  </header>

  <div class="table" id="table">
    <p class="note" id="note"></p>
    <div class="stage" id="stage">
      <div class="card source" id="source">Source</div>
      <div class="targets">
        <button type="button" class="card" data-target-id="left">Damage</button>
        <button type="button" class="card" data-target-id="middle">Glow</button>
        <button type="button" class="card" data-target-id="right">Damage</button>
        <button type="button" class="prompt" data-option="middle">Choose glow target</button>
      </div>
    </div>
  </div>
  <div id="arrow-preview"></div>

  <div class="presets" role="group" aria-label="Presets and playback">
    <span>Start from</span>
    <button type="button" id="kit" aria-pressed="true">Kit default</button>
    <button type="button" id="flash-preset" aria-pressed="false">Visible flash</button>
    <button type="button" id="play">Play</button>
  </div>

  <div class="ctls" id="ctls"></div>

  <div>
    <div class="codebar"><h2>These settings in code</h2><button type="button" id="copy">Copy</button></div>
    <pre class="code" id="code"></pre>
  </div>
</div>

<script>
//@kit-js tuners/src/target-arrow-hit.mjs as ARROW
const { STRIKE_MS, aimedZone, createStrikes } = ARROW;
const CTLS = [
  ['Strike and hit', [
    ['flash', 'Damage flash', 'color', 'Colour drawn over a damage target.'],
    ['flashAlpha', 'Damage flash opacity', 0, 1, .01, '×', 'The kit fallback is transparent. Increase this to see the flash.'],
    ['speed', 'Motion scale', 0, 3, .05, '×', 'Multiplies all durations. At 0, dashes stop and strikes are instant.'],
  ]],
];

const $ = (id) => document.getElementById(id);
const zones = [...$('stage').querySelectorAll('button')];
const options = zones.filter((el) => el.dataset.targetId).map((el) => ({ id: el.dataset.targetId }));
const strikes = createStrikes();
const preview = ARROW.mountArrowPreview($('arrow-preview'));
const source = () => $('source');
const damage = (prompt) => prompt.target !== 'middle';
const probe = document.createElement('div');
probe.style.backgroundColor = 'var(--target-arrow-hit, transparent)';
$('table').appendChild(probe);
const [r, g, b, flashAlpha = 1] = getComputedStyle(probe).backgroundColor.match(/[\d.]+/g).map(Number);
probe.remove();
const kitCSS = $('kit-css').textContent;
const KIT = {
  flash: '#' + [r, g, b].map((channel) => channel.toString(16).padStart(2, '0')).join(''),
  flashAlpha,
  speed: Number(kitCSS.match(/var\(--motion-scale,\s*([\d.]+)/)[1]),
};

let s = { ...KIT };
let last = 'left';
let nextPrompt = 0;
let prompt = { id: String(nextPrompt), options };
const renderArrow = () => preview({ prompt, source, strikes, damage, speed: s.speed });

function play(id, auto = true) {
  last = id;
  strikes.announce({ prompt: { ...prompt, target: id }, ids: [id], auto });
  prompt = { id: String(++nextPrompt), options };
  renderArrow();
}

function mark(id) {
  for (const name of ['kit', 'flash-preset']) $(name).setAttribute('aria-pressed', String(name === id));
}

function build() {
  for (const [title, rows] of CTLS) {
    const fs = document.createElement('fieldset');
    fs.innerHTML = `<legend>${title}</legend>`;
    for (const [key, label, min, max, step, unit, help] of rows) {
      const color = min === 'color';
      const d = document.createElement('div'); d.className = 'ctl';
      d.innerHTML = `<label for="c-${key}">${label}</label><output id="o-${key}" for="c-${key}"></output><input id="c-${key}" ${color ? 'type="color"' : `type="range" min="${min}" max="${max}" step="${step}"`} aria-describedby="h-${key}"><small id="h-${key}">${color ? max : help}</small>`;
      const input = d.querySelector('input');
      input.dataset.unit = unit ?? '';
      input.addEventListener('input', () => {
        s[key] = color ? input.value : input.valueAsNumber;
        mark(null);
        render();
        play(last);
      });
      fs.appendChild(d);
    }
    $('ctls').appendChild(fs);
  }
}

const tone = (color, opacity) => `color-mix(in srgb, ${color} ${+(opacity * 100).toFixed(2)}%, transparent)`;

function render() {
  for (const [, rows] of CTLS) for (const [key] of rows) {
    const input = $('c-' + key);
    input.value = s[key];
    $('o-' + key).textContent = s[key] + (input.dataset.unit ? ' ' + input.dataset.unit : '');
  }
  renderArrow();
  const flash = tone(s.flash, s.flashAlpha);
  document.documentElement.style.setProperty('--target-arrow-hit', flash);
  document.documentElement.style.setProperty('--motion-scale', s.speed);
  const time = Math.round((STRIKE_MS.draw + STRIKE_MS.hold + STRIKE_MS.collapse) * s.speed);
  $('note').textContent = s.speed === 0 ? 'Motion is off. The arrow still aims, with stationary dashes.' :
    `A full strike hits after ${time} ms. An aimed click starts at collapse.`;
  $('code').textContent =
`<TargetArrow {...props} speed={${s.speed}} />

--motion-scale: ${s.speed};
--target-arrow-hit: ${flash};`;
}

for (const el of zones) el.addEventListener('click', () => play(el.dataset.targetId ?? el.dataset.option, false));
$('play').addEventListener('click', () => play(last));
$('kit').addEventListener('click', () => { s = { ...KIT }; mark('kit'); render(); play(last); });
$('flash-preset').addEventListener('click', () => {
  s = { ...KIT, flash: '#ff664d', flashAlpha: 1 };
  mark('flash-preset');
  render();
  play('left');
});
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('code').textContent); $('copy').textContent = 'Copied'; }
  catch { const r = document.createRange(); r.selectNodeContents($('code')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $('copy').textContent = 'Selected: press Ctrl+C'; }
  setTimeout(() => { $('copy').textContent = 'Copy'; }, 1800);
});
build();
render();
</script>
</html>
