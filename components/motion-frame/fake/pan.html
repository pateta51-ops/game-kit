<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone pan lab</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: #111822; color: #e7edf5; font: 16px system-ui; }
  #lab { height: 100dvh; max-width: 420px; margin: auto; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  header, footer { padding: 16px; background: #182433; }
  h1 { margin: 0 0 14px; font-size: 22px; }
  nav { display: flex; gap: 8px; }
  button { border: 1px solid #506580; border-radius: 8px; color: inherit; padding: 9px 14px; background: #26394f; font: inherit; }
  button[aria-selected="true"], #play { background: #bcecff; color: #152334; }
  main { overflow: auto; padding: 16px; }
  article { min-height: 152px; padding: 18px; margin-bottom: 14px; border-radius: 12px; background: #1d2c3e; }
  article h2 { margin: 0; font-size: 19px; }
  article p { color: #c0cede; }
  #actor { background: #23465a; border: 2px solid #75d9fb; }
  #actor[data-playing] { background: #366d66; border-color: #9efa9d; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  output { font-size: 14px; }
  #sheet { display: flex; gap: 8px; padding: 8px; }
  iframe { width: 390px; height: 664px; border: 0; }
</style>
<div id="lab">
  <header>
    <h1>Phone pan lab</h1>
    <nav role="tablist" aria-label="Board tabs">
      <button type="button" role="tab" aria-selected="true" aria-controls="board">Board</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="tray">Tray</button>
    </nav>
  </header>
  <main>
    <section id="board" role="tabpanel" aria-label="Board">
      <article><h2>Command</h2><p>Your starting tab</p></article>
      <article><h2>Supply</h2></article>
      <article><h2>Reserves</h2></article>
      <article><h2>Discard</h2></article>
    </section>
    <section id="tray" role="tabpanel" aria-label="Tray" hidden>
      <article><h2>Draw pile</h2></article>
      <article><h2>Offer</h2></article>
      <article><h2>Staging area</h2></article>
      <article id="actor"><h2>Signal token</h2><p>Actor for both beats</p></article>
      <article><h2>Spent tokens</h2></article>
      <article><h2>Reserve tokens</h2></article>
    </section>
  </main>
  <footer><button id="play" type="button">Play two beats</button><output>Ready</output></footer>
</div>
<script type="module" src="./pan-lab.ts"></script>
</html>
