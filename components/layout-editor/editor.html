<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout editor</title>
<style>
html,body{margin:0;height:100%;background:#15171c;color:#dde1ea;font:13px system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 376px;grid-template-rows:auto 1fr auto;height:100vh}
#bar{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px;border-bottom:1px solid #2c3040;align-items:center}
#bar .sep{width:1px;align-self:stretch;background:#2c3040;margin:0 2px}
button,select,input{font:inherit;color:inherit;background:#232734;border:1px solid #3a4052;border-radius:4px;padding:3px 7px}
button:hover{background:#2e3446}button.on{background:#3b5bdb;border-color:#5c7cfa}
input[type=number]{width:66px;box-sizing:border-box;padding:3px 4px}input[type=text]{width:100%;box-sizing:border-box}input[type=range]{padding:0}
.tab{border-radius:4px 4px 0 0}.tab.on{background:#3b5bdb}
#wrap{position:relative;overflow:auto;touch-action:none;background:#0d0e12}#wrap.grab,#wrap.grab *{cursor:grab!important}
#pad{position:relative}
#stage{position:absolute;background-color:#1b1e27;outline:1px solid #4a5068;touch-action:none;user-select:none}
#zPct{display:inline-block;min-width:44px;text-align:center}
.z.k-component{border-style:dashed;background:hsl(var(--h) 60% 50% / .06)}
.z.k-component>.t,.z.k-pile>.t{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.z.k-group{border-width:1px;background:hsl(var(--h) 60% 50% / .05)}
#ptags .t.tab{transform:none;border-radius:0 0 3px 0}
.pl{position:absolute;box-sizing:border-box;border:1px solid #b8c0d4;border-radius:3px;background:#1b1e27;pointer-events:none;box-shadow:3px -3px 0 -1px #1b1e27,3px -3px 0 0 #b8c0d4,6px -6px 0 -1px #1b1e27,6px -6px 0 0 #b8c0d4}
.cnt{position:absolute;right:2px;bottom:1px;font-size:10px;color:#9aa3b8}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.z{position:absolute;box-sizing:border-box;border:1.5px solid hsl(var(--h) 60% 60%);background:hsl(var(--h) 60% 50% / .13);cursor:move}
.z.locked{cursor:default;border-style:dotted}.z.warn{border:2px dashed #f59f00}.z.bad{border:2.5px solid #fa5252}
.z.sel{outline:2px solid #fff;outline-offset:1px}
.t{position:absolute;left:1px;top:1px;max-width:calc(100% - 2px);max-height:calc(100% - 2px);overflow:hidden;background:#0d0e12d0;padding:0 3px;border-radius:3px;line-height:1.2;pointer-events:none;box-sizing:border-box}
.t.one{white-space:nowrap}.t.brk{overflow-wrap:anywhere}.t.one br{display:none}.t.none{display:none}
#ptags .t{max-width:none;max-height:none;transform:translateX(-100%);font-size:11px}
.t b{color:#fff}.t i{color:#9aa3b8;font-style:normal}
.c{position:absolute;box-sizing:border-box;border:1px dashed #b8c0d4;border-radius:3px;pointer-events:none}.c.out{border-color:#fa5252}
.g{position:absolute;background:#e64980;pointer-events:none;z-index:99999}
#selbox{position:absolute;pointer-events:none;z-index:100000}
.h{position:absolute;width:12px;height:12px;background:#fff;border:1px solid #3b5bdb;pointer-events:auto;box-sizing:border-box}
@media (pointer:coarse){.h{width:24px;height:24px}}
#ptags{position:absolute;inset:0;pointer-events:none;z-index:99998}
#marq{position:absolute;border:1px dashed #fff;background:#fff2;pointer-events:none;z-index:100001;display:none}
#panel{grid-row:2/4;grid-column:2;overflow:auto;border-left:1px solid #2c3040;padding:6px 8px}
#panel h3{margin:10px 0 4px;font-size:12px;text-transform:uppercase;color:#8d96ad;letter-spacing:.05em}
.f{display:grid;grid-template-columns:70px 1fr;gap:4px 6px;align-items:center}
.xywh{display:flex;gap:4px;flex-wrap:wrap}
.row{display:flex;gap:4px;align-items:center;padding:1px 0;cursor:pointer;white-space:nowrap}.row.sel{background:#3b5bdb55}
.row button{padding:0 4px;font-size:11px;color:#6b7387}.row button.on{color:#fff;background:#232734}
.row span{overflow:hidden;text-overflow:ellipsis}
#warns div{color:#ffa8a8;cursor:pointer;padding:1px 0}
#status{grid-column:1;padding:3px 8px;border-top:1px solid #2c3040;color:#9aa3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rdlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:200001}
#rdlg>div{background:#1b1e27;border:1px solid #3a4052;border-radius:6px;padding:12px;width:min(420px,94vw);display:flex;flex-direction:column;gap:8px}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:200000}
#dlg>div{background:#1b1e27;border:1px solid #3a4052;border-radius:6px;padding:10px;width:min(720px,94vw);display:flex;flex-direction:column;gap:6px}
#dlg textarea{height:50vh;background:#0d0e12;color:#dde1ea;font:12px monospace;border:1px solid #3a4052}
#msg{color:#ffd43b}
@media (max-width:760px){
#app{grid-template-columns:1fr;grid-template-rows:auto 42vh auto 1fr}
#bar{grid-column:1}#panel{grid-row:4;grid-column:1;border-left:0;border-top:1px solid #2c3040}
}
</style>
</head>
<body>
<div id="app">
<div id="bar">
  <span id="tabs"></span><button id="addScreen" title="Add a new empty screen (for example a phone layout) and switch to it.">+ screen</button><span class="sep"></span>
  <button id="undo" title="Take back your last change. Shortcut: Ctrl+Z.">Undo</button><button id="redo" title="Put back the change you just undid. Shortcut: Ctrl+Y.">Redo</button><span class="sep"></span>
  <button id="add" title="Add a new box. If a box is selected, the new one goes inside it.">+ Zone</button><button id="dup" title="Make a copy of the selected boxes. Shortcut: Ctrl+D.">Duplicate</button><button id="del" title="Delete the selected boxes and everything inside them. Shortcut: Delete.">Delete</button>
  <button id="fwd" title="Draw the selected box in front of the others.">Forward</button><button id="back" title="Draw the selected box behind the others.">Back</button><span class="sep"></span>
  <button data-al="left" title="Line up the selected boxes on their left edge (select two or more).">⇤</button><button data-al="centre" title="Line up the selected boxes on their centre, left to right (select two or more).">↔</button><button data-al="right" title="Line up the selected boxes on their right edge (select two or more).">⇥</button>
  <button data-al="top" title="Line up the selected boxes on their top edge (select two or more).">⤒</button><button data-al="middle" title="Line up the selected boxes on their centre, top to bottom (select two or more).">↕</button><button data-al="bottom" title="Line up the selected boxes on their bottom edge (select two or more).">⤓</button>
  <button data-dist="h" title="Space three or more selected boxes evenly from left to right.">⋯</button><button data-dist="v" title="Space three or more selected boxes evenly from top to bottom.">⋮</button><span class="sep"></span>
  <button id="cons" title="Select two or more piles (Shift+click), pick column or row, then click: they become small tiles in one box.">Consolidate</button><select id="consDir" title="Whether the consolidated piles sit in a column or in a row."><option>column</option><option>row</option></select><button id="split" title="Select a consolidated box (…piles) and click to put all its piles back at full card size beside it. To take out only one pile, select that pile and use Take out.">Split</button><button id="takeOut" title="Select one or more piles inside a consolidated box and click: each goes back to a full-size card pile beside the box, and the box shrinks to fit the piles left.">Take out</button><span class="sep"></span>
  <button id="multi" title="On a phone or tablet: tap adds boxes to the selection instead of replacing it (same as Shift+click).">Multi</button>
  <button id="snapGrid" class="on" title="When on, boxes jump to the grid lines as you move or resize them. Hold Alt to move freely.">Snap to grid</button><select id="grid" title="How far apart the grid lines are, in pixels."><option>8</option><option selected>16</option><option>32</option><option>64</option></select><button id="snapZones" class="on" title="When on, boxes stick to the edges and centres of other boxes (pink lines). Hold Alt to move freely.">Snap to zones</button><span class="sep"></span>
  <button id="zOut" title="Zoom out. Also Ctrl+wheel or pinch.">−</button><span id="zPct" title="The current zoom.">100%</span><button id="zIn" title="Zoom in. Also Ctrl+wheel or pinch.">+</button><button id="zFit" title="Zoom so the whole screen fits in the window.">Fit</button><span class="sep"></span>
  <button id="json" title="Show the layout as text to copy or download, or paste a layout in to load it.">Import / Export</button><button id="reset" title="Go back to the layout you started with, on every screen. It asks first; Undo cannot bring your work back.">Reset</button>
  <span id="msg"></span>
</div>
<div id="wrap"><div id="pad"><div id="stage"><img id="bg" alt=""><div id="zones"></div><div id="ptags"></div><div id="guides"></div><div id="selbox"></div><div id="marq"></div></div></div></div>
<div id="status"></div>
<div id="panel">
  <h3>Screen</h3>
  <div class="f">
    <span>Name</span><input id="sName" type="text" title="The name of this screen. A name like solo/table makes a mode tab (solo) with a variant tab (table).">
    <span>Size</span><span class="xywh"><input id="sW" type="number" min="1" title="Screen width in pixels."><input id="sH" type="number" min="1" title="Screen height in pixels."><button id="delScreen" title="Delete this whole screen and all its boxes.">Remove screen</button></span>
    <span>Card</span><span class="xywh"><input id="cW" type="number" min="1" title="Card width in pixels on this screen."><input id="cH" type="number" min="1" title="Card height in pixels on this screen."></span>
    <span>Card scale</span><input id="cS" type="range" min="25" max="200" value="100" title="Drag to make every card on this screen bigger or smaller at once.">
    <span>Pile</span><span class="xywh"><input id="pW" type="number" min="1" title="Width of a pile tile in pixels (a pile is a small stack of cards)."><input id="pH" type="number" min="1" title="Height of a pile tile in pixels."><input id="pS" type="range" min="10" max="100" title="Pile size, as a percentage of the card size." style="width:84px"><span id="pSv"></span></span>
    <span>Copy zones</span><span class="xywh"><select id="cpScreen" title="The screen to copy a box from."></select><select id="cpZone" title="The box to copy, with everything inside it." style="max-width:130px"></select><button id="cpGo" title="Copy that box into this screen.">Copy here</button></span>
    <span>Children</span><label title="When on, resizing a box leaves the boxes inside it at their size instead of scaling them."><input id="keep" type="checkbox" title="Keep the boxes inside at their size when the outer box is resized."> keep size when the parent is resized</label>
    <span>Backdrop</span><span class="xywh"><input id="bgFile" type="file" accept="image/*" style="width:180px" title="Pick a picture to show behind the boxes, to trace over."><input id="bgUrl" type="text" placeholder="or picture URL, Enter" title="Or type the address of a picture and press Enter."><input id="bgOp" type="range" min="0" max="100" value="50" title="How see-through the backdrop picture is."><button id="bgOff" title="Remove the backdrop picture from this screen.">No backdrop</button></span>
  </div>
  <h3>Zone</h3>
  <div class="f" id="zf">
    <span>Id</span><input id="zId" type="text" title="The box's name in the layout file. A box named you.hand sits inside the box you. Press Enter to rename.">
    <span>Label</span><input id="zLabel" type="text" placeholder="what it holds" title="A note shown on the box about what it holds.">
    <span>x y w h</span><span class="xywh"><input id="zX" type="number" title="Distance from the left edge of the screen, in pixels."><input id="zY" type="number" title="Distance from the top edge of the screen, in pixels."><input id="zW" type="number" min="1" title="Width of the box in pixels."><input id="zH" type="number" min="1" title="Height of the box in pixels."></span>
    <span>Kind</span><span class="xywh"><select id="zKind" title="What the box is: cards, a digital part, a pile, or a band that holds other boxes."><option value="" title="Decided from the box: card outlines if it has a card count, else a plain box.">auto</option><option title="Shows card outlines, side by side.">cards</option><option title="A part that is not a card, such as a crew board, log or button: dashed box.">component</option><option title="One small stack of cards (draw or discard pile). To make it look like a card pile again, pick this and tick full size.">pile</option><option title="A container for other boxes, such as a player band.">group</option></select><label title="Draw the pile at the full card size instead of the small pile size."><input id="zFull" type="checkbox" title="Draw this pile at full card size instead of the small pile size."> full size</label></span>
    <span>Cards</span><span class="xywh"><input id="zCards" type="number" min="0" title="How many cards this box holds. The red edge shows if they do not fit."><select id="zFan" title="How the cards lie: side by side in a row, in a column, as one pile, or in a grid."><option>row</option><option>column</option><option>stack</option><option>grid</option></select></span>
    <span>Card size here</span><span class="xywh"><input id="zS" type="range" min="20" max="100" value="100" title="Shrink the cards in this box only, to fit them in less space. The game must draw them smaller here. 100% is the normal card size."><input id="zSn" type="number" min="20" max="100" title="Card size in this box, 20 to 100 percent of the normal card size."><span>%</span></span>
    <span>Mirror</span><span class="xywh"><button id="flipV" title="Turn the selected boxes upside down inside the screen (a mirror image, top to bottom).">Flip ↕</button><button id="flipH" title="Turn the selected boxes left to right inside the screen (a mirror image).">Flip ↔</button><input id="mirTo" type="text" placeholder="copy as id" style="width:110px" title="Type a new name first, then Flip, to make a mirrored copy under that name instead of flipping the original."></span>
  </div>
  <h3>Warnings</h3><div id="warns"></div>
  <h3>Zones</h3><div id="tree"></div>
</div>
</div>
<div id="rdlg"><div><p>Reset everything? All your changes to every screen, including the backdrops, go back to the starting layout.</p><div class="xywh"><button id="rGo" style="background:#c0392b;color:#fff" title="Yes: throw away all my changes.">Reset</button><button id="rNo" title="No: keep my work.">Cancel</button></div></div></div>
<div id="dlg"><div>
  <b>Layout JSON</b>
  <textarea id="txt" spellcheck="false"></textarea>
  <div class="xywh"><button id="copy" title="Copy the layout text, to paste it in the chat.">Copy</button><button id="dl" title="Save the layout as a layout.json file.">Download</button><button id="loadTxt" title="Replace the layout with the text above.">Load this text</button><input id="file" type="file" accept=".json,application/json" title="Pick a layout.json file to load."><button id="close" title="Close this window.">Close</button></div>
</div></div>
