<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout editor</title>
<style>
html,body{margin:0;height:100%;background:#15171c;color:#dde1ea;font:13px system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 376px;grid-template-rows:auto 1fr auto;height:100vh}
#bar{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px;border-bottom:1px solid #2c3040;align-items:center}
#bar .sep{width:1px;align-self:stretch;background:#2c3040;margin:0 2px}
button,select,input{font:inherit;color:inherit;background:#232734;border:1px solid #3a4052;border-radius:4px;padding:3px 7px}
button:hover{background:#2e3446}button.on{background:#3b5bdb;border-color:#5c7cfa}
input[type=number]{width:66px;box-sizing:border-box;padding:3px 4px}input[type=text]{width:100%;box-sizing:border-box}input[type=range]{padding:0}
.tab{border-radius:4px 4px 0 0}.tab.on{background:#3b5bdb}
#wrap{position:relative;overflow:hidden;touch-action:none;background:#0d0e12}
#stage{position:absolute;background:#1b1e27;outline:1px solid #4a5068;touch-action:none;user-select:none}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.z{position:absolute;box-sizing:border-box;border:1.5px solid hsl(var(--h) 60% 60%);background:hsl(var(--h) 60% 50% / .13);cursor:move}
.z.locked{cursor:default;border-style:dotted}.z.warn{border:2px dashed #f59f00}.z.bad{border:2.5px solid #fa5252}
.z.sel{outline:2px solid #fff;outline-offset:1px}
.t{position:absolute;left:1px;top:1px;max-width:calc(100% - 2px);max-height:calc(100% - 2px);overflow:hidden;background:#0d0e12d0;padding:0 3px;border-radius:3px;line-height:1.2;pointer-events:none;box-sizing:border-box}
.t.one{white-space:nowrap}.t.brk{overflow-wrap:anywhere}.t.one br{display:none}.t.none{display:none}
#ptags .t{max-width:none;max-height:none;transform:translateX(-100%);font-size:11px}
.t b{color:#fff}.t i{color:#9aa3b8;font-style:normal}
.c{position:absolute;box-sizing:border-box;border:1px dashed #b8c0d4;border-radius:3px;pointer-events:none}.c.out{border-color:#fa5252}
.g{position:absolute;background:#e64980;pointer-events:none;z-index:99999}
#selbox{position:absolute;pointer-events:none;z-index:100000}
.h{position:absolute;width:12px;height:12px;background:#fff;border:1px solid #3b5bdb;pointer-events:auto;box-sizing:border-box}
@media (pointer:coarse){.h{width:24px;height:24px}}
#ptags{position:absolute;inset:0;pointer-events:none;z-index:99998}
#marq{position:absolute;border:1px dashed #fff;background:#fff2;pointer-events:none;z-index:100001;display:none}
#panel{grid-row:2/4;grid-column:2;overflow:auto;border-left:1px solid #2c3040;padding:6px 8px}
#panel h3{margin:10px 0 4px;font-size:12px;text-transform:uppercase;color:#8d96ad;letter-spacing:.05em}
.f{display:grid;grid-template-columns:70px 1fr;gap:4px 6px;align-items:center}
.xywh{display:flex;gap:4px;flex-wrap:wrap}
.row{display:flex;gap:4px;align-items:center;padding:1px 0;cursor:pointer;white-space:nowrap}.row.sel{background:#3b5bdb55}
.row button{padding:0 4px;font-size:11px;color:#6b7387}.row button.on{color:#fff;background:#232734}
.row span{overflow:hidden;text-overflow:ellipsis}
#warns div{color:#ffa8a8;cursor:pointer;padding:1px 0}
#status{grid-column:1;padding:3px 8px;border-top:1px solid #2c3040;color:#9aa3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:200000}
#dlg>div{background:#1b1e27;border:1px solid #3a4052;border-radius:6px;padding:10px;width:min(720px,94vw);display:flex;flex-direction:column;gap:6px}
#dlg textarea{height:50vh;background:#0d0e12;color:#dde1ea;font:12px monospace;border:1px solid #3a4052}
#msg{color:#ffd43b}
@media (max-width:760px){
#app{grid-template-columns:1fr;grid-template-rows:auto 42vh auto 1fr}
#bar{grid-column:1}#panel{grid-row:4;grid-column:1;border-left:0;border-top:1px solid #2c3040}
}
</style>
</head>
<body>
<div id="app">
<div id="bar">
  <span id="tabs"></span><button id="addScreen" title="Add a screen">+ screen</button><span class="sep"></span>
  <button id="undo" title="Ctrl+Z">Undo</button><button id="redo" title="Ctrl+Y">Redo</button><span class="sep"></span>
  <button id="add" title="Add a zone (inside the selected one)">+ Zone</button><button id="dup" title="Ctrl+D">Duplicate</button><button id="del" title="Delete">Delete</button>
  <button id="fwd">Forward</button><button id="back">Back</button><span class="sep"></span>
  <button data-al="left" title="Align left">⇤</button><button data-al="centre" title="Align centre">↔</button><button data-al="right" title="Align right">⇥</button>
  <button data-al="top" title="Align top">⤒</button><button data-al="middle" title="Align middle">↕</button><button data-al="bottom" title="Align bottom">⤓</button>
  <button data-dist="h" title="Distribute across">⋯</button><button data-dist="v" title="Distribute down">⋮</button><span class="sep"></span>
  <button id="multi" title="Tap adds to the selection (touch)">Multi</button>
  <label>Grid <select id="grid"><option value="0">off</option><option>8</option><option selected>16</option><option>32</option><option>64</option></select></label>
  <button id="json">Import / Export</button>
  <span id="msg"></span>
</div>
<div id="wrap"><div id="stage"><img id="bg" alt=""><div id="zones"></div><div id="ptags"></div><div id="guides"></div><div id="selbox"></div><div id="marq"></div></div></div>
<div id="status"></div>
<div id="panel">
  <h3>Screen</h3>
  <div class="f">
    <span>Name</span><input id="sName" type="text">
    <span>Size</span><span class="xywh"><input id="sW" type="number" min="1"><input id="sH" type="number" min="1"><button id="delScreen">Remove screen</button></span>
    <span>Card</span><span class="xywh"><input id="cW" type="number" min="1"><input id="cH" type="number" min="1"></span>
    <span>Card scale</span><input id="cS" type="range" min="25" max="200" value="100">
    <span>Children</span><label><input id="keep" type="checkbox"> keep size when the parent is resized</label>
    <span>Backdrop</span><span class="xywh"><input id="bgFile" type="file" accept="image/*" style="width:180px"><input id="bgUrl" type="text" placeholder="or picture URL, Enter"><input id="bgOp" type="range" min="0" max="100" value="50" title="Opacity"><button id="bgOff">No backdrop</button></span>
  </div>
  <h3>Zone</h3>
  <div class="f" id="zf">
    <span>Id</span><input id="zId" type="text">
    <span>Label</span><input id="zLabel" type="text" placeholder="what it holds">
    <span>x y w h</span><span class="xywh"><input id="zX" type="number"><input id="zY" type="number"><input id="zW" type="number" min="1"><input id="zH" type="number" min="1"></span>
    <span>Cards</span><span class="xywh"><input id="zCards" type="number" min="0"><select id="zFan"><option>row</option><option>column</option><option>stack</option><option>grid</option></select></span>
    <span>Mirror</span><span class="xywh"><button id="flipV">Flip ↕</button><button id="flipH">Flip ↔</button><input id="mirTo" type="text" placeholder="copy as id" style="width:110px"></span>
  </div>
  <h3>Warnings</h3><div id="warns"></div>
  <h3>Zones</h3><div id="tree"></div>
</div>
</div>
<div id="dlg"><div>
  <b>Layout JSON</b>
  <textarea id="txt" spellcheck="false"></textarea>
  <div class="xywh"><button id="copy">Copy</button><button id="dl">Download</button><button id="loadTxt">Load this text</button><input id="file" type="file" accept=".json,application/json"><button id="close">Close</button></div>
</div></div>

function uniq(s, k) { let n = k, i = 2; while (s.zones[n]) n = k + '-' + i++; return n }
