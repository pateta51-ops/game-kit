<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Effect library motion lab</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; padding: 4vw; background: #e8e6e1; color: #222; font: 20px system-ui }
  header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem }
  h1 { margin: 0; font-size: 2rem }
  button { font: inherit }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(max(24rem, 26vw),100%),1fr)); gap: 2vw }
  section { position: relative; height: max(15rem, 20vw); background: white; overflow: hidden; border: 1px solid #b9b9b0 }
  h2 { position: absolute; z-index: 1; left: 1rem; margin: 1rem 0; font-size: 1.2rem }
  .field { background: var(--board); color: var(--chalk) }
  .sample { display: grid; place-items: center }
  section > .sample, .landing, .score-grid { position: absolute }
  .ball { left: 15%; top: 72%; width: 6%; aspect-ratio: 1; border-radius: 50%; background: var(--chalk); border: 3px dashed var(--red) }
  .landing { left: 82%; top: 28%; width: 6%; aspect-ratio: 1; border: 1px dashed; border-radius: 50% }
  .card { left: 38%; top: 24%; width: 24%; height: 64%; background: var(--chalk); color: var(--board); border: .3rem double var(--board); border-radius: .3rem; font: bold clamp(1rem, 1.5vw, 3rem) Georgia }
  .lamp { left: 40%; top: 38%; width: 20%; aspect-ratio: 1; border-radius: 50%; background: #151515; border: .4rem solid #555 }
  .lamp[data-fx-flipped] { background: var(--red) }
  .score-grid { inset: 35% 15% auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1vw }
  .tin-plate { padding: .25em; text-align: center; font: bold clamp(1.2rem, 4vw, 6rem) Georgia; border: .2rem solid; background: var(--chalk); color: var(--board) }
  .pennant { left: 12%; top: 20%; width: 76%; height: 70%; background: var(--red); color: var(--chalk); clip-path: polygon(0 0,100% 0,100% 60%,50% 100%,0 60%); padding-bottom: 60px; font: 700 clamp(1.25rem, 2.1vw, 150px) Arvo, serif }
  .die, .slot { left: 18%; top: 48%; width: 13%; aspect-ratio: 1; border-radius: .5rem }
  .die { background: var(--chalk); color: var(--board); font: bold clamp(1rem, 3vw, 5rem) Georgia }
  .slot { border: 1px dashed }
  .tray { left: 70% }
  .flight-source .ball, .pennant-source .pennant { visibility: hidden }
</style>
<header><h1>Effect library motion lab</h1><button type="button">Replay</button></header>
<main>
  <section class="field flight-source"><h2>Arc move</h2><div id="ball" class="ball sample"></div><div id="landing" class="landing"></div></section>
  <section class="field"><h2>Glow with hold</h2><div id="card" class="card sample">Pitcher</div></section>
  <section class="field"><h2>Flip without squash</h2><div id="lamp" class="lamp sample" aria-label="Lamp"></div></section>
  <section class="field"><h2>Shake group</h2><div id="plates" class="score-grid"><div class="tin-plate">3</div><div class="tin-plate">2</div><div class="tin-plate">1</div></div></section>
  <section class="field pennant-source"><h2>Unroll</h2><div id="pennant" class="pennant sample">Champions</div></section>
  <section class="field"><h2>Hide source</h2><div class="slot sample"></div><div id="die" class="die sample">⚄</div><div id="tray" class="tray slot sample"></div></section>
</main>
<script type="module" src="./lab.ts"></script>
</html>
