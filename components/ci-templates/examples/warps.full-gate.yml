# BUILD_PLAN §4.12: the Full gate before a merge: `npm run check` and the Playwright e2e suite on a pull request's head
# merged into main, with a full checkout. Started by hand (workflow_dispatch) by the architect for a pull request it is
# about to merge, never on a push. `runner` picks where: the owner's self-hosted runner (label warp, Windows) when it is
# online, else ubuntu-latest while the month's minutes allow; otherwise the architect runs tools/architect/local-ci.sh in
# the container. It refuses a pull request whose head is not in this repository, so the self-hosted runner only ever runs
# this repository's own code (no pull_request_target anywhere). The steps that need logic run in Node
# (.github/scripts/full-gate.mjs), so the same file works on Windows and Linux. The simulation and its bands (S10) run below; later batches add tutorial:check,
# glossary:check (§4.12).
name: Full gate

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      sha:
        description: The pull request's head commit (40 hex characters) that the gate must test
        required: true
      runner:
        description: Where to run (self-hosted = the owner's runner, label warp)
        type: choice
        options: [self-hosted, ubuntu-latest]
        default: self-hosted
      bands:
        description: Also run npm run sim:bands (200 greedy games per 1-3 star pairing, about 4 minutes on 16 cores; BUILD_PLAN 10.6)
        type: boolean
        default: false

concurrency:
  group: full-gate-${{ inputs.pr }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Full gate (check, sim, e2e) on PR head merged with main
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","warp"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
    # The checkout lives in its own directory, not the workspace root, which ci.yml shares on this runner.
    defaults:
      run:
        working-directory: full-gate
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          path: full-gate
      - name: Check the inputs and that the PR head is in this repository; merge it into main
        run: node .github/scripts/full-gate.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: full-gate/.nvmrc
          # Cache only on GitHub-hosted runs: the save step fails on the Windows runner (see ci.yml).
          cache: ${{ inputs.runner == 'ubuntu-latest' && 'npm' || '' }}
          cache-dependency-path: full-gate/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # docs/rust-port/ARCHITECTURE.md "Gate": the Rust port (fmt, clippy -D warnings, cargo test, conformance on the sample).
      # The owner's runner is Windows: cargo runs in its WSL Ubuntu, where rustup lives (engine-rs/rust-toolchain.toml).
      - name: Rust port (WSL)
        if: ${{ inputs.runner == 'self-hosted' }}
        run: wsl -d Ubuntu -- bash engine-rs/scripts/gate.sh
      - name: Rust port
        if: ${{ inputs.runner != 'self-hosted' }}
        run: bash engine-rs/scripts/gate.sh
      # BUILD_PLAN 10.6: 500 games over every fighter x mothership pairing; a failed band is an error (since v1.0).
      - name: Simulation with sanity bands
        run: npm run sim -- --games 500 --all --bands
      # BUILD_PLAN 10.6: the 500-game run cannot judge the "0 greedy wins in 200 games" band (about 7 games per pairing)
      - name: Per-pairing band run (200 greedy games per 1-3 star pairing)
        if: ${{ inputs.bands }}
        run: npm run sim:bands
      # BUILD_PLAN 10.6 "Perf budget": applyAction p95 under 5 ms (S10 review: here, not in check)
      - name: Perf budget
        run: node .github/scripts/full-gate.mjs perf
      - name: Playwright's Chromium
        run: node .github/scripts/full-gate.mjs browsers
      - name: End-to-end tests
        run: node .github/scripts/full-gate.mjs e2e
