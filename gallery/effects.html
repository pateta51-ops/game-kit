<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effects gallery</title>
<style>
:root { --bg: #111317; --tile: #1a1d22; --stage: #0c0e11; --line: #2a2e35; --fg: #e9ebee; --muted: #9298a2; --accent: #7cc4ff; --a: #3f8f7d; --b: #b07a3a;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: rgb(17 19 23 / .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1400px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
h1 { font-size: 18px; margin: 0; font-weight: 700; }
.count { color: var(--muted); font-size: 13px; }
.slow { margin-left: auto; display: flex; gap: 8px; align-items: center; cursor: pointer; user-select: none; }
.slow input { accent-color: var(--accent); width: 16px; height: 16px; }
nav { max-width: 1400px; margin: 0 auto; padding: 0 20px 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav a { flex: none; color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
nav a:hover { border-color: var(--accent); }
nav a span { color: var(--muted); margin-left: 4px; }
main { max-width: 1400px; margin: 0 auto; padding: 8px 20px 60px; }
section { scroll-margin-top: 110px; }
.head { display: flex; align-items: baseline; gap: 14px; margin: 28px 0 12px; }
h2 { font-size: 16px; margin: 0; letter-spacing: .01em; }
h2::first-letter { text-transform: uppercase; }
button { font: 600 12px system-ui, sans-serif; color: var(--fg); background: #23272e; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.tile { background: var(--tile); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
.tile.playing { border-color: var(--accent); }
.stage { position: relative; aspect-ratio: 720 / 420; background: var(--stage); overflow: hidden; cursor: pointer; container-type: inline-size; }
.fit { position: absolute; left: 0; top: 0; width: 720px; height: 420px; transform-origin: 0 0; transform: scale(calc(100cqw / 720px)); }
.world { position: absolute; inset: 0; }
.card { position: absolute; width: 120px; height: 168px; border-radius: 10px; display: grid; place-items: center; font: 700 64px/1 system-ui, sans-serif; color: #fff; box-shadow: 0 4px 14px #0008; border: 2px solid rgb(255 255 255 / .25); }
.card.A { background: var(--a); }
.card.B { background: var(--b); }
.world > .card.A { left: 80px; top: 120px; }
.world > .card.B { left: 520px; top: 120px; }
.playing .world > .card { visibility: hidden; }
.hint { position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: var(--muted); background: rgb(0 0 0 / .5); padding: 2px 7px; border-radius: 4px; pointer-events: none; }
.playing .hint { opacity: 0; }
.body { padding: 10px 14px 4px; display: grid; gap: 6px; align-content: start; }
h3 { font-size: 14.5px; margin: 0; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 12px var(--mono); color: var(--muted); }
.meta code { color: var(--accent); }
.meta .opt { color: #d6b4ff; }
.meta .ms { margin-left: auto; }
.looks { margin: 0; color: #bfc4cc; font-size: 13px; }
.foot { padding: 8px 14px 12px; display: grid; gap: 8px; }
.links { display: flex; gap: 10px; align-items: center; font-size: 12.5px; }
.links a { color: var(--accent); text-decoration: none; margin-left: auto; }
details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
pre { margin: 6px 0 0; background: #0f1114; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: 11.5px/1.5 var(--mono); color: #cdd6df; overflow: auto; max-height: 220px; white-space: pre; }
.banner-lines { position: absolute; left: 50%; top: 50%; translate: -50% -50%; display: grid; gap: 6px; text-align: center; font: 700 30px system-ui, sans-serif; color: #fff; text-shadow: 0 2px 8px #000; white-space: nowrap; }
@media (max-width: 560px) { .bar, nav, main { padding-left: 12px; padding-right: 12px; } .slow { margin-left: 0; } }
/* ===== game-kit components/effect-library/looks/glitch.css, inlined by tuners/build.mjs ===== */
/* Opt-in look for createGlitch(el, opts). Without `mask` the copies and slices are copies of the element's content (text or markup), coloured by --glitch-a and --glitch-b; with `mask` (or --glitch-mask) set to url(shape.svg) they are flat colour cut to that shape. Variables: --glitch-a, --glitch-b, --glitch-split, --glitch-jump (number, % of width), --glitch-dropout (opacity), --glitch-ms and --glitch-side and --glitch-skew (set by the scheduler). With `burstSteps` the scheduler holds the class fx-glitch--steps and redraws the slice variables per step: no keyframes. */
.fx-glitch {
  --glitch-a: #fff;
  --glitch-b: #888;
  --glitch-split: .6%;
  --glitch-jump: 2.4;
  --glitch-dropout: .3;
  --glitch-ms: 200ms;
  position: relative;
  isolation: isolate;
}
.fx-glitch-layer {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  mix-blend-mode: screen;
  color: var(--glitch-a);
}
.fx-glitch-copy--a { --offset: calc(-1 * var(--glitch-split)); }
.fx-glitch-copy--b { --offset: var(--glitch-split); color: var(--glitch-b); }
.fx-glitch-slice { --top: 20%; --bottom: 60%; --jump: 1; clip-path: inset(var(--top) 0 var(--bottom)); }
.fx-glitch-slice--b { color: var(--glitch-b); }
/* with the `mask` option the layers are flat colour cut to --glitch-mask; without it they are copies of the content */
.fx-glitch--masked > .fx-glitch-layer {
  mask: var(--glitch-mask, none) center / 100% 100% no-repeat;
  background: currentColor;
  > * { visibility: hidden; }
}

@media (prefers-reduced-motion: no-preference) {
  .fx-glitch--burst {
    animation: fx-glitch-dropout var(--glitch-ms) steps(1, end);
    > .fx-glitch-copy { animation: fx-glitch-split var(--glitch-ms) steps(1, end); }
    > .fx-glitch-slice { animation: fx-glitch-slices var(--glitch-ms) steps(1, end); }
  }
  .fx-glitch--steps {
    > .fx-glitch-copy { opacity: .7; transform: translateX(calc(var(--glitch-side, 1) * var(--offset))); }
    > .fx-glitch-slice { opacity: .9; transform: translateX(calc(var(--jump) * var(--glitch-jump) * 1%)); }
  }
  .fx-glitch--steps.fx-glitch--skew { transform: skewX(var(--glitch-skew, 0deg)); }
  .fx-glitch--burst.fx-glitch--skew { animation: fx-glitch-dropout var(--glitch-ms) steps(1, end), fx-glitch-skew var(--glitch-ms) steps(1, end); }
  .fx-glitch--steps.fx-glitch--drop { opacity: var(--glitch-dropout); }
  .fx-glitch--tear {
    --glitch-split: 2%;
    animation: fx-glitch-tear-dropout var(--glitch-ms) steps(1, end);
    > .fx-glitch-copy { animation: fx-glitch-tear-split var(--glitch-ms) steps(1, end); }
    > .fx-glitch-slice { animation: fx-glitch-tear-slices var(--glitch-ms) steps(1, end); }
  }
}

@keyframes fx-glitch-dropout { 0%, 75% { opacity: 1; } 50% { opacity: var(--glitch-dropout); } }
@keyframes fx-glitch-skew { 0%, 50% { transform: none; } 25% { transform: skewX(var(--glitch-skew, 0deg)); } }
@keyframes fx-glitch-split {
  0% { opacity: .82; transform: translateX(var(--offset)); }
  25% { opacity: .5; transform: translateX(calc(1.6 * var(--offset))); }
  50% { opacity: 0; }
  75% { opacity: .44; transform: translateX(var(--offset)); }
}
@keyframes fx-glitch-slices {
  0%, 50% { opacity: 0; }
  25% { opacity: .9; transform: translateX(calc(var(--jump) * var(--glitch-jump) * 1%)); }
  75% { opacity: .65; transform: translateX(calc(-1 * var(--jump) * var(--glitch-jump) * 1%)); }
}
@keyframes fx-glitch-tear-dropout { 0%, 50% { opacity: 1; } 37.5% { opacity: var(--glitch-dropout); } }
@keyframes fx-glitch-tear-split {
  0%, 50% { opacity: .9; transform: translateX(var(--offset)); }
  12.5%, 62.5% { opacity: .85; transform: translateX(calc(-1 * var(--offset))); }
  25% { opacity: .8; transform: translateX(var(--offset)); }
  37.5%, 87.5% { opacity: 0; }
  75% { opacity: .55; transform: translateX(calc(.4 * var(--offset))); }
}
@keyframes fx-glitch-tear-slices {
  0%, 37.5%, 87.5% { opacity: 0; }
  12.5%, 50% { opacity: .9; transform: translateX(calc(var(--jump) * var(--glitch-jump) * 1%)); }
  25%, 62.5% {
    opacity: 1;
    clip-path: inset(calc(var(--top) - 8%) 0 calc(var(--bottom) - 5%));
    transform: translateX(calc(-1 * var(--jump) * var(--glitch-jump) * 1%));
  }
  75% { opacity: .7; transform: translateX(calc(var(--jump) * var(--glitch-jump) * 1%)); }
}
