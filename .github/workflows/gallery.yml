name: gallery

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['gallery/**', 'components/effect-library/**']

permissions:
  contents: read

jobs:
  strips:
    name: gallery strips
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node gallery/build.mjs --strips
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-strips
          path: gallery/strips
      - run: |
          node gallery/build.mjs --strips --only=move,glow--latch --out=/tmp/a
          node gallery/build.mjs --strips --only=move,glow--latch --out=/tmp/b
          cmp /tmp/a/move.png /tmp/b/move.png || true
          cmp /tmp/a/glow--latch.png /tmp/b/glow--latch.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: dbg
          path: |
            /tmp/a
            /tmp/b
