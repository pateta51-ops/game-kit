name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, kit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  scan-ingest:
    name: pytest scan-ingest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, kit]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: components/scan-ingest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 -m venv "$RUNNER_TEMP/scan-ingest-venv"
          PY="$RUNNER_TEMP/scan-ingest-venv/bin/python"
          "$PY" -m pip install -q -r requirements.txt
          OMP_THREAD_LIMIT=1 "$PY" -m pytest tests -q -p no:cacheprovider
