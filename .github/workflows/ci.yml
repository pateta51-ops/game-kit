name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: npm run check
    runs-on: ${{ fromJSON(vars.KIT_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the starter compatibility tag
        run: git fetch --no-tags --depth=1 origin tag v0.272.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Capture coverage source and remove stale results
        id: coverage-source
        run: node scripts/coverage-table.mjs --capture "$RUNNER_TEMP/game-kit-coverage-start.json"
      - run: echo "::remove-matcher owner=tsc::"
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright-core install --with-deps chromium
      - id: checks
        run: node components/check-runner/check-runner.ts --config check-runner.config.json --keep-going
        env:
          NO_COLOR: '1'
      - name: Select a retained successful main ancestor
        if: always() && steps.coverage-source.outcome == 'success'
        run: node scripts/coverage-baseline.mjs "$RUNNER_TEMP/game-kit-coverage-baseline"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record coverage from this check
        if: always() && steps.coverage-source.outcome == 'success'
        run: node scripts/coverage-table.mjs --started "$RUNNER_TEMP/game-kit-coverage-start.json" --check-outcome "$CHECK_OUTCOME" --baseline "$RUNNER_TEMP/game-kit-coverage-baseline"
        env:
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
      - name: Retain exact-source coverage evidence
        if: always() && steps.coverage-source.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ steps.coverage-source.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            coverage/coverage-evidence.json
            coverage/coverage-evidence.md
          if-no-files-found: error
          retention-days: 30

  windows-paths:
    name: Windows path alias cases
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Execute and require all five Windows cases
        shell: pwsh
        run: node scripts/platform-cases.mjs windows "$env:RUNNER_TEMP/windows-cases.json"
      - name: Retain case execution and source identity
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-cases-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-cases.json*
          if-no-files-found: error
          retention-days: 30

  pdf-capability:
    name: PDF rendering capability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund pdfjs-dist@6.5.438 @napi-rs/canvas@1.2.1
      - name: Execute real optional PDF rendering
        run: node scripts/platform-cases.mjs pdf "$RUNNER_TEMP/pdf-cases.json"
      - name: Retain capability and case execution
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-cases-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pdf-cases.json*
          if-no-files-found: error
          retention-days: 30

  scan-ingest:
    name: pytest scan-ingest
    runs-on: ${{ fromJSON(vars.KIT_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then BASE="origin/${{ github.base_ref }}"; else BASE="${{ github.event.before }}"; fi
          if git rev-parse -q --verify "$BASE^{commit}" >/dev/null && git diff --quiet "$BASE" HEAD -- components/scan-ingest .github/workflows/ci.yml; then echo run=no >> "$GITHUB_OUTPUT"; else echo run=yes >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.run == 'yes'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - if: steps.changed.outputs.run == 'yes'
        run: sudo apt-get install -y -q tesseract-ocr
      - if: steps.changed.outputs.run == 'yes'
        working-directory: components/scan-ingest
        run: |
          python3 -m venv "$RUNNER_TEMP/scan-ingest-venv"
          PY="$RUNNER_TEMP/scan-ingest-venv/bin/python"
          "$PY" -m pip install -q -r requirements.txt
          OMP_THREAD_LIMIT=1 "$PY" -m pytest tests -q -p no:cacheprovider
